<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>beHome TrustCycle</title>
<meta name="description" content="beHome TrustCycle: a class concept for quality-assured home cleaning. Not an official Be Group product.">
<meta name="theme-color" content="#FFD20A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TrustCycle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style id="screen-style"></style>
</head>
<body>
<div id="wrap">
  <aside id="panel" aria-label="Screens">
    <div class="brand"><span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l9 7.4v.9h-2V20a1 1 0 01-1 1h-4v-6h-4v6H6a1 1 0 01-1-1v-8.5H3v-.9z" fill="currentColor"/></svg></span>
      <div><b>beHome TrustCycle</b><small>Class concept · not an official Be Group product</small></div>
    </div>
    <p class="app-tag">Overview</p>
    <nav id="screen-list"></nav>
    <label class="toggle"><input type="checkbox" class="toggle-labels"> Show stage labels on screens</label>
    <button type="button" class="reset">Start over</button>
  </aside>
  <main id="stage">
    <div id="phone"><div id="screen"></div></div>
    <div id="board-wrap"><div id="board"></div></div>
    <button type="button" id="menu-btn" aria-label="Screens" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-label="Screens">
        <div class="sheet-head"><p class="app-tag">Overview</p><button type="button" id="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <nav id="sheet-list"></nav>
        <label class="toggle"><input type="checkbox" class="toggle-labels"> Show stage labels on screens</label>
        <button type="button" class="reset">Start over</button>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
