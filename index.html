<body>
<div id="wrap">
  <aside id="panel" aria-label="Screens">
    <div class="brand"><span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l9 7.4v.9h-2V20a1 1 0 01-1 1h-4v-6h-4v6H6a1 1 0 01-1-1v-8.5H3v-.9z" fill="currentColor"/></svg></span>
      <div><b>beHome TrustCycle</b><small>Class concept · not an official Be Group product</small></div>
    </div>
    <p class="app-tag">Overview</p>
    <nav id="screen-list"></nav>
    <label class="toggle"><input type="checkbox" class="toggle-labels"> Show stage labels on screens</label>
    <button type="button" id="present-btn" aria-pressed="false" aria-keyshortcuts="P">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M10 8.5v4l3.5-2z"/></svg>
      <span>Present</span><kbd>P</kbd>
    </button>
    <button type="button" class="reset">Start over</button>
  </aside>
  <main id="stage">
    <div id="phone"><div id="screen"></div></div>
    <div id="board-wrap"><div id="board"></div></div>
    <button type="button" id="menu-btn" aria-label="Screens" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <button type="button" id="present-hint" hidden>P / Esc to exit · ← → to move</button>
    <div id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-label="Screens">
        <div class="sheet-head"><p class="app-tag">Overview</p><button type="button" id="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <nav id="sheet-list"></nav>
        <label class="toggle"><input type="checkbox" class="toggle-labels"> Show stage labels on screens</label>
        <button type="button" class="reset">Start over</button>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
